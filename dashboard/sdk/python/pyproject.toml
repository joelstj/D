[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "l2-arbitrage-sdk"
version = "0.1.0"
description = "Python client for the L2 Arbitrage GUI REST + WebSocket API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
stream = ["websocket-client>=1.6"]

[tool.setuptools]
packages = ["l2_arbitrage"]
