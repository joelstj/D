# Base pool registry.
#
# Real, on-chain-verified pools: every entry was independently confirmed live
# via a direct eth_call to the Uniswap V3 factory's getPool() (not a
# search/summary) — the factory is fingerprinted on-chain before use
# (scripts/discover_pools.py), and each pool's own token0()/token1()/fee() is
# cross-checked against what was asked for. The startup validation gate
# (docs/ARCHITECTURE.md §7) re-proves every entry on-chain again before it
# enters the live set regardless — a stale entry is rejected loudly, never
# silently trusted. See config/pools/README.md for the full schema.

