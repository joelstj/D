# Base pool registry.
#
# Real, on-chain-verified pools: each was confirmed live via a direct eth_call
# to the Uniswap V3 factory's getPool() (not a search/summary), reading
# token0/token1/liquidity() at the time of writing. The startup validation gate
# (docs/ARCHITECTURE.md §7) re-proves every entry on-chain before it enters the
# live set regardless — a stale entry is rejected loudly, never silently trusted.
# See config/pools/README.md for the full schema.

