# Optimism pool registry.
#
# Real, on-chain-verified pools across WETH/USDC/USDT/DAI (every pairing that
# has a live Uniswap V3 pool, at every standard fee tier that exists) —
# auto-discovered and independently re-verified by scripts/discover_pools.py:
# the factory is fingerprinted on-chain before use, and every pool's own
# token0()/token1()/fee() is cross-checked against what was asked for before
# acceptance. The startup validation gate (docs/ARCHITECTURE.md §7) re-proves
# every entry on-chain again before it enters the live set regardless — a
# stale entry is rejected loudly, never silently trusted. Curate freely — add,
# remove, or hand-edit entries. See config/pools/README.md for the schema.
#
# Token addresses used: WETH 0x4200...0006, USDC (native) 0x0b2C...Ff85,
# USDT 0x94b0...e58, DAI 0xDA10...0da1.

