# Unichain pool registry.
#
# Real, on-chain-verified pools: each was confirmed live via a direct eth_call
# to Unichain's own Uniswap V3 factory's getPool() (NOT the cross-chain-default
# factory address — Unichain got its own deployment, see config/addresses.js),
# reading token0/token1/liquidity() at the time of writing; zero-liquidity
# results (a real pool contract with no funds in it) were excluded rather than
# listed. The startup validation gate (docs/ARCHITECTURE.md §7) re-proves every
# entry on-chain before it enters the live set regardless. Unichain's own
# liquidity is overwhelmingly Uniswap V4 (per Uniswap's 2026 usage stats, ~75%
# of all V4 volume system-wide) — these V3 pools are real but not the whole
# picture; a V4 registry section is a reasonable follow-up once poolId/hook
# data is curated (see the [[pool]] kind="v4" schema in README.md).

