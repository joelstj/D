# =============================================================================
# Cross-chain detection (optional). Canonical assets + their per-chain
# representations, real bridge economics, and the (asset, numeraire) pairs to
# scan. Bridge params are config (sourced from bridge docs, kept current) — they
# are not on-chain-derivable. See docs/ENGINE_CONTRACT.md §8.
#
# Every address below is a real, individually-sourced contract address (not a
# placeholder) — cross-checked against an official source (project docs, Circle's
# multi-chain USDC list, Chainlink's/Lido's own deployment pages, the
# Uniswap official token list) and a block explorer, per invariant 1 (no invented
# on-chain data). Full sourcing + confidence notes: docs/notes-arbitrage-gui-
# compile-deploy.md. `native = true` marks canonical L2 issuance (Circle CCTP
# USDC, each chain's own WETH); every non-WETH/USDC asset here is a bridged
# representation (`native = false`) of a mainnet-native token — still a real,
# currently-used contract, just not minted natively on that L2.
#
# Deliberately excluded rather than forced: ARB and OP (each verified to have NO
# genuine canonical presence outside its home chain — one search even surfaced an
# active scam token squatting the "OP" symbol on Arbitrum); USDT on Ink (Ink's
# de facto USDT is a distinct token, USDT0, not the same contract/asset as plain
# USDT elsewhere — listing it under the same symbol would misrepresent two
# different tokens as fungible); DAI/WBTC/wstETH/cbETH/LINK/UNI/AAVE on Ink (no
# credible non-scam deployment found — Ink's ecosystem is real but still thin).
#
# Bridge rows: every route below assumes a generic fast intent/solver bridge
# (the pattern `CrossChainArbitrageExecutor.sol` itself names, e.g. Across) —
# same `fee_bps`/`settle_seconds` this file's original WETH example already
# used, which is itself already conservative versus Across's real 2026
# published range (~5-15bps, sub-minute fills for major-asset L2-L2 routes) —
# so these numbers under-state speed and over-state cost rather than the
# reverse. Each token routes through its deepest-liquidity chain as a hub
# (Arbitrum, except cbETH which hubs through Base, its native chain) rather
# than a full pairwise matrix, in both directions per spoke.
[cross_chain]
enabled = true
pairs   = [
  ["WETH", "USDC"], ["WETH", "USDT"], ["WETH", "DAI"], ["WETH", "WBTC"],
  ["USDC", "USDT"], ["USDC", "DAI"],
  ["WETH", "LINK"], ["WETH", "UNI"], ["WETH", "AAVE"],
  ["WETH", "wstETH"], ["WETH", "cbETH"], ["WETH", "rETH"],
  ["WETH", "CRV"], ["WETH", "FRAX"], ["WETH", "LDO"],
]

[[cross_chain.assets]]
