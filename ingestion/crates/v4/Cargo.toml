[package]
name = "l2i-v4"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Uniswap V4 adapter: PoolManager logs by poolId, StateView reconcile, hook gate, dynamic fee -> v3 shape"

[lints]
workspace = true

[dependencies]
l2i-core = { path = "../core" }
l2i-chains = { path = "../chains" }
l2i-rpc = { path = "../rpc" }
l2i-registry = { path = "../registry" }
l2i-ingest = { path = "../ingest" }
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true

[dev-dependencies]
l2i-rpc = { path = "../rpc", features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
