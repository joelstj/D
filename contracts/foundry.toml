# Foundry configuration.
#
# The contracts are toolchain-agnostic; this repo is verified end-to-end with
# Hardhat (see README), and these Foundry settings let you build/test/deploy the
# same sources with Forge. To use Foundry:
#
#   curl -L https://foundry.paradigm.xyz | bash && foundryup
#   forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts@v5.0.2
#   forge build
#   ARBITRUM_RPC_URL="https://arb1.arbitrum.io/rpc" \
#     forge test --match-path 'test/foundry/*' --fork-url "$ARBITRUM_RPC_URL" -vvv
#
# Polygon fork suite (single-chain, needs its own --fork-url):
#   POLYGON_RPC_URL="https://polygon-rpc.com" \
#     forge test --match-path 'test/foundry/PolygonFork.t.sol' --fork-url "$POLYGON_RPC_URL" -vvv
#
# Cross-chain dual-fork suite (creates BOTH forks itself via vm.createFork —
# do NOT pass --fork-url for this one):
#   POLYGON_RPC_URL="https://polygon-rpc.com" ARBITRUM_RPC_URL="https://arb1.arbitrum.io/rpc" \
#     forge test --match-path 'test/foundry/CrossChainDualFork.t.sol' -vvv

[profile.default]
src = "contracts"
out = "out"
test = "test/foundry"
libs = ["lib", "node_modules"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 1000000
# evm_version sets the REVM *execution* spec for tests (and requests the solc
# compile target). solc 0.8.20 caps its target at Shanghai — cancun support
# landed in 0.8.24 — so forge clamps the compiler to Shanghai automatically while
# still executing at Cancun. Cancun execution is required for mainnet-fork tests:
#   - Paris rejects PUSH0 (Shanghai) — the live Aave V3 Pool implementation emits
#     it, so even a premium read reverts with `NotActivated` under Paris.
#   - Shanghai runs PUSH0 but rejects TSTORE/TLOAD (Cancun) — Aave V3.3's flash
#     loan uses EIP-1153 transient storage for its reentrancy guard, so a real
#     Aave `flashLoanSimple` reverts with `NotActivated` under Shanghai.
#   - Cancun runs both, so the full fork suite (Aave *and* Balancer flash loans)
#     executes against real on-chain state. All five target L2s run Cancun today.
# This mirrors the Hardhat config: Paris compile target + `hardfork: "cancun"`
# execution.
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]

# Resolve the OZ import path whether OZ comes from npm (node_modules) or
# `forge install` (lib/openzeppelin-contracts). node_modules wins if present.
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
optimism = "${OPTIMISM_RPC_URL}"
base = "${BASE_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
ink = "${INK_RPC_URL}"
unichain = "${UNICHAIN_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"

[etherscan]
optimism = { key = "${ETHERSCAN_API_KEY}" }
base = { key = "${ETHERSCAN_API_KEY}" }
arbitrum = { key = "${ETHERSCAN_API_KEY}" }
polygon = { key = "${ETHERSCAN_API_KEY}" }
