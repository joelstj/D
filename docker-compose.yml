# ─────────────────────────────────────────────────────────────────────────────
# Full-stack container topology for the L2 Arbitrage Flash-Loan Bot.
#
#   ingestion ──POST /detect──▶ engine ──ranked opps──▶ ingestion ──ws :9001──▶
#   backend (DATA_SOURCE=external) ──REST + /ws──▶ frontend (UI on :8080)
#
# The launcher (`python -m l2arb run`) is the primary, smoke-tested run path.
# This compose is the container alternative. Detection only + paper execution:
# no keys, no transaction broadcast.
#
# Quick start:
#   cp ingestion/config/config.example.toml ingestion/config.toml
#   #  ↳ edit, per enabled chain — ALL of these, not just the endpoints:
#   #      ws_url / http_url        real RPC endpoints
#   #      hubs / numeraires        real token addresses (ship as "0xWETH", ...)
#   #      weth                     real wrapped-native address
#   #      native_price_pools       real WETH/<numeraire> pool per numeraire
#   #      pool_registry            a curated registry (see config/pools/)
#   #    and set [engine] http_url = "http://engine:8080"
#   ./ingestion/target/release/l2-ingest --check-config --config ingestion/config.toml
#   docker compose up --build
#   open http://localhost:8080
#
# Run `--check-config` first: it is the authoritative pre-flight and exits non-zero
# with the exact field to fix. Filling in only the endpoints is NOT enough — the
# token-address fields above ship as placeholders too, and a chain that keeps them
# can price gas in no numeraire, so the engine correctly rejects every opportunity
# it finds and the dashboard stays empty forever. That used to pass `--check-config`
# silently; it is now rejected there (see l2i_config::Config::validate).
#
# Until ingestion/config.toml is genuinely filled in, the engine + ingestion run but
# emit no opportunities (we never fabricate on-chain data). The dashboard is
# still reachable and healthy.
# ─────────────────────────────────────────────────────────────────────────────
services:
  engine:
    build:
      context: ./engine
    expose:
      - "8080"          # POST /detect, GET /health (internal to the compose net)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6

  ingestion:
    build:
      context: ./ingestion
    depends_on:
      engine:
        condition: service_healthy
    expose:
      - "9001"          # ws opportunity feed consumed by the dashboard backend
      - "9090"          # health
      - "9100"          # prometheus metrics
    volumes:
      # Provide real endpoints here. The engine URL inside the compose network is
      # http://engine:8080 (set that in [engine].http_url of your config.toml).
      - ./ingestion/config.toml:/etc/l2-ingest/config.toml:ro

  backend:
    build:
      context: ./dashboard
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8787"
      DATA_SOURCE: "external"                    # consume real detections
      INGEST_FEED_URL: "ws://ingestion:9001"
      EXECUTION_MODE: "paper"                    # detection + simulation only
      CORS_ORIGIN: "http://localhost:8080"
    depends_on:
      - engine
      - ingestion
    ports:
      - "8787:8787"                              # REST + /ws (also proxied by nginx)

  frontend:
    build:
      context: ./dashboard
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"                                # the dashboard UI
