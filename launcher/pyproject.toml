[project]
name = "l2arb-launcher"
version = "0.1.0"
description = "Installer / launcher / supervisor for the L2 Arbitrage Flash-Loan Bot"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Intentionally dependency-free (stdlib only) so it bundles into a single-file
# PyInstaller executable with no third-party wheels to resolve.
dependencies = []

[project.scripts]
l2arb = "l2arb.cli:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["l2arb"]
