[project]
name = "l2arb"
version = "0.0.1"
description = "Off-chain, near-zero-latency arbitrage detection engine for Layer 2 blockchains (detection only; no execution)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "l2arb maintainers" }]

# ---------------------------------------------------------------------------
# Runtime dependencies — the CORE on-chain stack.
#
# The engine's source of truth is live blockchain state read over RPC. These
# deps exist to read, decode, cache, and reason about that state with the
# lowest latency practical in Python. See docs/TECH_STACK.md for rationale and
# for how the requested quant/analytics libraries map onto the analytics group.
# ---------------------------------------------------------------------------
dependencies = [
  # --- Web3 / on-chain data (the heart of the engine) ---
  "web3>=7.0",            # async JSON-RPC, contract ABIs, event decoding
  "eth-abi>=5.0",         # ABI encode/decode for raw eth_call hot paths
  "eth-utils>=4.0",
  "aiohttp>=3.10",        # async HTTP for RPC + REST providers
  "websockets>=13.0",     # newHeads / logs subscriptions
  "tenacity>=9.0",        # retry/backoff for flaky RPC
  "orjson>=3.10",         # fast JSON for the WS decode hot path

  # --- Numerics / data ---
  "numpy>=2.1",
  "numba>=0.60",          # JIT for cycle-search and AMM math hot loops
  "polars>=1.9",          # fast columnar analytics / snapshotting
  "pandas>=2.2",          # interop with the quant stack

  # --- Config / validation / logging ---
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",

  # --- Persistence / streaming ---
  "redis>=5.1",           # async hot-state cache
  "sqlalchemy>=2.0",      # opportunity + snapshot store
  "asyncpg>=0.30",        # Postgres/TimescaleDB async driver
  "alembic>=1.13",        # schema migrations

  # --- Service / observability ---
  "fastapi>=0.115",       # read-only opportunity API
  "uvicorn>=0.32",
  "prometheus-client>=0.21",

  # --- CEX reference prices (requested: CCXT) ---
  "ccxt>=4.4",            # cross-checks + optional CEX<>DEX spreads

  # --- Graph utilities (reference/validation; hot path is custom) ---
  "networkx>=3.4",
]

[project.optional-dependencies]
# Quant / research / backtesting stack (the libraries requested in the brief).
# Kept optional so the low-latency runtime image stays lean. Installed for the
# backtesting + analytics phases only. See docs/TECH_STACK.md.
analytics = [
  "backtrader>=1.9",
  "PyPortfolioOpt>=1.5",
  "quantstats>=0.0.62",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "arch>=7.0",
  "matplotlib>=3.9",
  "plotly>=5.24",
  "mplfinance>=0.12.10b0",
  # NOTE: arbitragelab (hudson-and-thames) is heavy and historically gated
  # behind an analyst license for some features. Add it deliberately in the
  # research phase only if the license permits; keep it OUT of any runtime path.
  # "arbitragelab>=0.9",
]

# Dev tooling lives in a PEP 735 dependency group (installed by default by
# `uv sync`, and never pruned by `uv run`). This keeps the heavy `analytics`
# extra opt-in while the lint/type/test toolchain is always present.
[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-benchmark>=4.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "hypothesis>=6.112",
  "aioresponses>=0.7",
  "httpx>=0.27",          # FastAPI TestClient transport for API contract tests
  "aiosqlite>=0.20",      # in-memory async SQL for the opportunity-store unit tests
  "freezegun>=1.5",
  "ruff>=0.7",
  "mypy>=1.12",
  "pip-audit>=2.7",
  "bandit>=1.7",
  "pre-commit>=4.0",
  "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l2arb"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter ("syntax" and "style" tier of the test taxonomy)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                 # isort
  "N",                 # pep8-naming
  "UP",                # pyupgrade
  "B",                 # bugbear
  "SIM",               # simplify
  "C4",                # comprehensions
  "PT",                # pytest style
  "ASYNC",             # async correctness (critical for latency paths)
  "PERF",              # performance anti-patterns
  "S",                 # bandit-style security lints
  "RUF",
]
ignore = [
  "S101",  # asserts are allowed (further relaxed for tests below)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PLR2004", "ARG"]
# Guard scripts shell out to git and print diagnostics by design.
"scripts/**/*.py" = ["S603", "S607", "T201"]

# ---------------------------------------------------------------------------
# Mypy — static types ("logic/interface" tier). Strict by default.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# `tests` is on the path so the shared `graphkit` test toolkit imports cleanly.
mypy_path = ["src", "scripts", "tests"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
# Third-party libs without stubs are ignored explicitly, never blanket-suppressed.
[[tool.mypy.overrides]]
module = ["numba.*", "ccxt.*", "backtrader.*", "pypfopt.*", "mplfinance.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest — the test runner. Markers define the taxonomy from TESTING_STRATEGY.md
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "scripts", "tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: pure logic, no I/O (AMM math, graph search).",
  "integration: crosses a boundary (RPC fork, DB, redis).",
  "chain: requires a forked or live chain node (may be network-gated).",
  "db: requires a Postgres/Timescale + Redis test instance.",
  "benchmark: latency/throughput regression gates (pytest-benchmark).",
  "verify: on-chain data-integrity checks vs an independent oracle.",
  "slow: long-running; excluded from the fast inner loop.",
]

# ---------------------------------------------------------------------------
# Coverage — ratcheting gate. Start realistic, raise as the engine matures.
# Core logic (AMM math + detection) is held to a stricter bar in CI.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/l2arb"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# fail_under is enforced in CI/Makefile so it can ratchet without editing here.
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
  # Typing-only constructs with no runtime behaviour to cover:
  "^\\s*\\.\\.\\.\\s*$",      # Protocol / overload stub bodies (bare `...`)
  "@(typing\\.)?overload",
]
