name: CI

# Root CI for the merged D super-repo. Each component keeps its own (now inert)
# workflow for history; THIS is the gate that runs on the merged tree. Every job
# runs the component's documented "definition of done" from CLAUDE.md §5.
#
# The contracts job runs the deterministic offline suites by default; the live
# mainnet-fork flash-loan tests run only when an RPC secret is configured (they
# self-skip otherwise), so CI is green with or without one.
#
# Both fork toolchains are wired, deliberately:
#   - the HARDHAT fork suites (test/fork/*.test.js) are the ones that actually
#     execute today and are the repo's only end-to-end proof that the executor
#     works against live Aave/Uniswap/Sushi/QuickSwap deployments;
#   - the FOUNDRY mirror runs when `forge` is available.
# Previously only the Foundry hook existed, so on any runner without a working
# Foundry setup the live-execution proof had no coverage at all.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: engine (l2arb · Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync deps
        run: uv sync
      - name: Lint (ruff)
        run: make lint
      - name: Types (mypy --strict)
        run: make types
      - name: Test pairing
        run: make pairing
      - name: No committed secrets
        run: uv run python scripts/check_no_secrets.py $(git ls-files)
      - name: Tests + coverage gate
        run: make test

  ingestion:
    name: ingestion (l2-ingest · Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show && cargo --version
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ingestion/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ingestion/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-features --workspace

  contracts:
    name: contracts (Solidity · Hardhat + Foundry)
    runs-on: ubuntu-latest
    env:
      # Empty when the secret is unset; the fork steps key off these (secrets are
      # not available directly in a step `if`, but env is).
      ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
      POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install node deps (OpenZeppelin + Hardhat)
        run: npm ci
      - name: Hardhat compile (solc 0.8.20, zero warnings)
        run: npm run compile
      - name: Hardhat offline unit tests
        run: npm test
      # The live-execution proof. These borrow from the real Aave V3 pool and
      # swap through real DEX deployments at the fork's head block, so they are
      # the only tests that exercise the contract against real infrastructure.
      # They self-skip without an RPC, but gate the step anyway so a missing
      # secret reads as "not run" rather than a silent pass.
      - name: Hardhat Arbitrum mainnet-fork flash-loan suite (optional)
        if: ${{ env.ARBITRUM_RPC_URL != '' }}
        run: FORK_RPC_URL="$ARBITRUM_RPC_URL" npm run test:fork
      - name: Hardhat Polygon mainnet-fork flash-loan suite (optional)
        if: ${{ env.POLYGON_RPC_URL != '' }}
        run: FORK_RPC_URL="$POLYGON_RPC_URL" npm run test:fork:polygon
      # Two independently-forked chains in one run; needs both secrets.
      - name: Hardhat cross-chain dual-fork suite (optional)
        if: ${{ env.ARBITRUM_RPC_URL != '' && env.POLYGON_RPC_URL != '' }}
        run: npm run test:fork:crosschain
      # End-to-end operator path: one real flash loan on live state, profit
      # routed to a named wallet. Nothing is broadcast (the script refuses any
      # network but the in-process fork); the receiver is a burn-address
      # placeholder so CI asserts routing without naming a real wallet.
      - name: Live flash-loan execution against forked live state (optional)
        if: ${{ env.ARBITRUM_RPC_URL != '' }}
        run: |
          FORK_RPC_URL="$ARBITRUM_RPC_URL" \
          PROFIT_RECEIVER=0x000000000000000000000000000000000000dEaD \
          npx hardhat run scripts/live_flash_loan_fork.js
      - name: Install Foundry
        # Pin the version: `forge fmt` output is version-sensitive and this tree
        # is formatted for Foundry 1.5.x. `stable` floats to newer releases whose
        # formatter reflows otherwise-unchanged code, failing `forge fmt --check`.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "1.5.1"
      - name: Vendor forge-std
        run: git clone --depth 1 --branch v1.9.4 https://github.com/foundry-rs/forge-std lib/forge-std
      - name: Forge fmt + build + test (offline; fork self-skips)
        run: bash scripts/verify.sh
      - name: Forge mainnet-fork flash-loan suite (optional)
        if: ${{ env.ARBITRUM_RPC_URL != '' }}
        run: VERIFY_FORK=1 bash scripts/verify.sh

  dashboard:
    name: dashboard (Node + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Verify (typecheck + test + build)
        run: pnpm verify

  launcher:
    name: launcher (orchestrator · Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s launcher/tests -v
